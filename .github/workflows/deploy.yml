name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token set required by the Pages deploy.
# NOTE: actions/deploy-pages mints an OIDC token, which needs id-token: write
# (id-token: read cannot create the token and the deploy would fail).
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage artifact (all of src/ except auth_db, plus only the auth_db files the site loads)
        run: |
          set -euo pipefail
          rsync -a --exclude 'lib/auth_db/' src/ "$RUNNER_TEMP/site/"
          for f in \
            lib/auth_db/shared/vendor/supabase/supabase.min.js \
            lib/auth_db/shared/services/authService.js
          do
            mkdir -p "$RUNNER_TEMP/site/$(dirname "$f")"
            cp "src/$f" "$RUNNER_TEMP/site/$f"
          done

      - name: Check every local reference resolves inside the staged tree
        run: python3 scripts/check-refs.py "$RUNNER_TEMP/site"

      - name: Upload artifact (staged site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
